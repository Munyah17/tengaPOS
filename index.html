<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="tengaPOS - Premium cloud-based POS and Inventory Management for African SMEs" />
    <meta name="theme-color" content="#1e40af" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking: a stylesheet link here would hold up the whole
         page behind a third-party request, so on a network where Google
         Fonts is slow/blocked/dropped silently, the app never renders at
         all. This still applies the stylesheet once it loads, but never
         blocks first paint on it. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <title>tengaPOS — Cloud POS & Inventory</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <!-- Fatal-error safety net: plain script (not type="module"), so it runs
         and works on any browser regardless of module support. Reported
         symptom: page loads fully over the network, nothing ever paints --
         classic signature of an uncaught JS error before React can mount
         (e.g. a browser/WebView missing some API the bundle assumes exists),
         which previously left a totally blank white screen with no way to
         tell what happened without console access. This catches that class
         of error and shows the actual message on screen instead, so it can
         be read and reported without needing devtools on the failing device.
         React's own <ErrorBoundary> (main.jsx) still handles ordinary
         render-time errors after mount; this only ever fires for something
         that broke before that had a chance to run. -->
    <script>
      (function () {
        var shown = false
        // A dynamic import() for a lazy route chunk gets compiled to a
        // SystemJS System.import() call for old-browser support (see
        // vite.config.js's plugin-legacy config) -- when that fails
        // because a deploy since replaced the chunk's filename, the
        // failure doesn't propagate through React's own error handling
        // the way a native import() rejection would, so it never reaches
        // ErrorBoundary.jsx's already-existing auto-reload for this exact
        // situation. It lands here instead, as a raw uncaught error --
        // confirmed live as "Uncaught SyntaxError: Unexpected token '<'"
        // (a stale chunk request being served the SPA's index.html
        // instead of a real 404, and the browser trying to parse that
        // HTML as JavaScript). This is a routine, self-healing stale-
        // deploy hiccup, not a real browser incompatibility -- recognize
        // it and recover the same way ErrorBoundary does, instead of
        // telling someone on a fully modern browser to "try a different
        // browser."
        var CHUNK_RELOAD_KEY = 'tengapos_chunk_reload_attempted'
        function isChunkLoadError(message) {
          return /fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed|Unexpected token '<'|systemjs|System error/i.test(message || '')
        }
        function hardReload() {
          var done = function () { window.location.reload() }
          try {
            var swReady = ('serviceWorker' in navigator)
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister() }))
                })
              : Promise.resolve()
            swReady.then(function () {
              if (!('caches' in window)) return
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k) }))
              })
            }).then(done, done)
          } catch (e) { done() }
        }
        // One silent reload before showing anything at all: the most common
        // cause of "nothing mounted" is a transient stall (first hit while
        // the dev server is still optimizing, a cold CDN edge, a service
        // worker mid-update) that a plain refresh clears. Showing a customer
        // an error for something a single reload fixes is a needless support
        // call -- retry once, invisibly, and only surface a message if the
        // retry didn't work either.
        var BOOT_RELOAD_KEY = 'tengapos_boot_reload_attempted'
        function trySilentReload() {
          try {
            if (!sessionStorage.getItem(BOOT_RELOAD_KEY)) {
              sessionStorage.setItem(BOOT_RELOAD_KEY, '1')
              window.location.reload()
              return true
            }
          } catch (e) { /* sessionStorage unavailable -- fall through to the message */ }
          return false
        }
        function showFatalError(message, allowSilentRetry) {
          if (shown) return
          var root = document.getElementById('root')
          if (!root || root.childElementCount > 0) return // React already mounted something — not fatal
          if (isChunkLoadError(message)) {
            try {
              if (!sessionStorage.getItem(CHUNK_RELOAD_KEY)) {
                sessionStorage.setItem(CHUNK_RELOAD_KEY, '1')
                hardReload()
                return
              }
            } catch (e) { /* sessionStorage unavailable — fall through to the message below */ }
          }
          if (allowSilentRetry && trySilentReload()) return
          shown = true
          // The technical detail goes to the console for support staff with
          // devtools -- the person standing at the till sees only a calm,
          // actionable message with a way to retry, never raw errors.
          if (window.console && console.error) {
            console.error('[tengaPOS boot]', message, (navigator && navigator.userAgent) || 'unknown ua')
          }
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'padding:24px;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#f8fafc;">' +
            '<div style="max-width:420px;text-align:center;">' +
            '<div style="font-size:17px;font-weight:700;color:#0f172a;margin-bottom:8px;">tengaPOS couldn\'t start</div>' +
            '<div style="font-size:13px;color:#64748b;margin-bottom:20px;">Something went wrong while loading. ' +
            'Please check your internet connection and try again.</div>' +
            '<button onclick="window.location.reload()" style="font-size:14px;font-weight:600;color:#ffffff;' +
            'background:#1e40af;border:none;border-radius:8px;padding:10px 28px;cursor:pointer;">Try again</button>' +
            '<div style="font-size:12px;color:#94a3b8;margin-top:16px;">If this keeps happening, please contact support.</div>' +
            '</div></div>'
        }
        window.addEventListener('error', function (e) {
          showFatalError((e && (e.message || (e.error && e.error.message))) || 'Script error')
        })
        window.addEventListener('unhandledrejection', function (e) {
          showFatalError('Unhandled promise rejection: ' + ((e.reason && (e.reason.message || e.reason)) || 'unknown'))
        })
        // If nothing rendered within a few seconds and no error fired either
        // (e.g. the module script itself silently failed to load, or a cold
        // dev server/CDN edge stalled the first request), retry once
        // invisibly and only then say something -- never stay blank forever.
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.childElementCount === 0) {
            showFatalError('The app did not start (no error was reported).', true)
          }
        }, 8000)
      })()
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
